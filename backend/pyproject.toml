[project]
name = "overwatch-queue-notifier-backend"
version = "0.1.0"
description = "Backend services for Overwatch Queue Notifier"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { text = "MIT" }
authors = [{ name = "Overwatch Queue Notifier" }]
dependencies = [
  "python-dotenv>=1.0.1",
  "fastapi>=0.111.0",
  "uvicorn>=0.30.0",
  "numpy>=1.26.0",
  "pillow>=10.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "pytest-cov>=5.0.0",
  "httpx>=0.27.0",
]
onnx = [
  "onnxruntime>=1.17.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.uv]
package = false
